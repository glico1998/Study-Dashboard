    async function dbLoad(key) {
      const { data, error } = await supabase
        .from("mcat_data")
        .select("value")
        .eq("user_id", USER_ID)
        .eq("key", key)
        .single();
      if (error || !data) return null;
      try { return JSON.parse(data.value); } catch { return null; }
    }

    async function dbSave(key, value) {
      const { error } = await supabase
        .from("mcat_data")
        .upsert({ user_id: USER_ID, key, value: JSON.stringify(value) }, { onConflict: "user_id,key" });
      if (error) console.error("Save error:", error);

    const PLANNER_SUBJECTS = [
      { label:"Biochemistry",    baseSubject:"Biochemistry",    color:"#f97316" },
      { label:"Biology",         baseSubject:"Biology",         color:"#4ade80" },
      { label:"Chemistry",       baseSubject:"Chemistry",       color:"#60a5fa" },
      { label:"Physics & Math",  baseSubject:"Physics & Math",  color:"#c084fc" },
      { label:"Organic Chemistry",baseSubject:"Organic Chemistry",color:"#fb923c" },
    ];

    const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
    const DAY_SHORT = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    const DAY_COLORS = {
      Monday:"#3b82f6", Tuesday:"#8b5cf6", Wednesday:"#06b6d4",
      Thursday:"#10b981", Friday:"#f59e0b", Saturday:"#f43f5e", Sunday:"#ec4899"
    };

    // ─── DATA FACTORIES ─────────────────────────────────────────────────────────
    function defaultWeek() {
      const days = {}; DAYS.forEach(d=>{ days[d]={sections:[]}; }); return { days };
    }
    function parseClKey(k) {
      const [si,ci,ti] = k.split("-").map(Number);
      const sd = CHECKLIST_DATA[si]; if (!sd) return null;
      const ch = sd.chapters[ci];   if (!ch) return null;
      return { si, ci, ti, subjectData:sd, chapter:ch, topicName: ch.topics[ti] || k };
    }
    function newLinkedSubsection(clKey) {
      return { id:crypto.randomUUID(), clKey, checks:{ textbook:false, claude:false }, subheadings:[], learningObjectives:"" };
    }
    function newSubheading() {
      return { id:crypto.randomUUID(), title:"", checks:{ textbook:false, claude:false } };
    }
    function resolveTopicName(clKey, clData) {
      const p = parseClKey(clKey); if (!p) return clKey;
      const saved = clData[clKey];
      return (saved && saved.customName) ? saved.customName : p.topicName;
    }
    function getChapterAnkiKey(si, ci) { return `anki-ch-${si}-${ci}`; }
    function getChapterAnki(si, ci, clData) { return !!clData[getChapterAnkiKey(si,ci)]; }
    function isChapterFullyReved(si, ci, clData) {
      const ch = CHECKLIST_DATA[si]?.chapters[ci]; if (!ch) return false;
      return ch.topics.every((_,ti) => { const s = clData[`${si}-${ci}-${ti}`]; return s && s.rev; });
    }

    const BASE_MONDAY = new Date(2025, 3, 28);
    function getWeekIndex(d) { return Math.max(0, Math.floor((d-BASE_MONDAY)/(7*86400000))); }
    function weekLabel(idx) {
      const s=new Date(BASE_MONDAY); s.setDate(s.getDate()+idx*7);
      const e=new Date(s); e.setDate(s.getDate()+6);
      const f=d=>d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
      return `${f(s)} – ${f(e)}`;
    }
    function groupSubsByChapter(subsections) {
      const map = new Map();
      subsections.forEach((sub, idx) => {
        const p = parseClKey(sub.clKey); if (!p) return;
        const k = `${p.si}-${p.ci}`;
        if (!map.has(k)) map.set(k, { si:p.si, ci:p.ci, chapterTitle:p.chapter.title, color:p.subjectData.color, subs:[] });
        map.get(k).subs.push({ sub, originalIdx:idx });
      });
      return [...map.values()];
    }

    // ─── SMALL UI ATOMS ─────────────────────────────────────────────────────────
    function MiniCheck({ checked, onChange, color, label }) {
      return (
        <button onClick={onChange} style={{ display:"flex", alignItems:"center", gap:3, background:"none", border:"none", padding:"1px 4px", borderRadius:4 }}>
          <span style={{ width:11, height:11, borderRadius:2, flexShrink:0, border:`1.5px solid ${checked?color:"var(--text-ghost)"}`, background:checked?color:"transparent", display:"flex", alignItems:"center", justifyContent:"center", transition:"all 0.12s" }}>
            {checked&&<svg width="7" height="7" viewBox="0 0 7 7" fill="none"><path d="M1 3.5L2.8 5.2L6 1.5" stroke="#0f172a" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg>}
          </span>
          <span style={{ fontSize:9, fontFamily:"'DM Mono', monospace", color:checked?color:"var(--text-faint)" }}>{label}</span>
        </button>
      );
    }
    const PLANNER_CHECKS = { textbook:{ label:"Textbook", color:"#4ade80" }, claude:{ label:"Claude", color:"#60a5fa" } };
    function CheckBadge({ checked, onChange, type }) {
      const { label, color } = PLANNER_CHECKS[type];
      return (
        <button onClick={onChange} style={{ display:"flex", alignItems:"center", gap:4, padding:"3px 8px", borderRadius:20, border:`1.5px solid ${checked?color:"var(--text-ghost)"}`, background:checked?`${color}22`:"transparent", fontSize:11, fontFamily:"'DM Mono', monospace", color:checked?color:"var(--text-dim)", transition:"all 0.15s", whiteSpace:"nowrap" }}>
          <span style={{ width:13, height:13, borderRadius:"50%", border:`1.5px solid ${checked?color:"var(--text-faint)"}`, background:checked?color:"transparent", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
            {checked&&<svg width="8" height="8" viewBox="0 0 8 8" fill="none"><path d="M1.5 4L3.2 5.7L6.5 2.3" stroke="#0f172a" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>}
          </span>
          {label}
        </button>
      );
    }
    const CHECK_META = { textbook:{label:"Textbook",color:"#4ade80"}, claude:{label:"Claude",color:"#60a5fa"}, anki:{label:"Anki",color:"#f97316"} };
    function CheckBox({ checked, onChange, type }) {
      const { label, color } = CHECK_META[type];
      return (
        <button onClick={onChange} style={{ display:"flex", alignItems:"center", gap:4, padding:"3px 8px", borderRadius:20, border:`1.5px solid ${checked?color:"var(--text-ghost)"}`, background:checked?`${color}22`:"transparent", fontSize:11, fontFamily:"'DM Mono', monospace", color:checked?color:"var(--text-dim)", transition:"all 0.15s", whiteSpace:"nowrap" }}>
          <span style={{ width:13, height:13, borderRadius:"50%", border:`1.5px solid ${checked?color:"var(--text-faint)"}`, background:checked?color:"transparent", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
            {checked&&<svg width="8" height="8" viewBox="0 0 8 8" fill="none"><path d="M1.5 4L3.2 5.7L6.5 2.3" stroke="#0f172a" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>}
          </span>
          {label}
        </button>
      );
    }

    // ─── SUBHEADING ROWS ─────────────────────────────────────────────────────────
    function SubheadingEdit({ sh, onChange, onDelete, onEnter, autoFocus }) {
      const ref = useRef(null);
      useEffect(()=>{ if(autoFocus&&ref.current) ref.current.focus(); },[autoFocus]);
      return (
        <div style={{ display:"flex", alignItems:"center", gap:5, marginBottom:4 }}>
          <span style={{ color:"var(--text-dim)", fontSize:12, fontFamily:"'DM Mono', monospace", flexShrink:0 }}>↳</span>
          <input ref={ref} value={sh.title} onChange={e=>onChange({...sh,title:e.target.value})}
            onKeyDown={e=>{ if(e.key==="Enter"){e.preventDefault();onEnter();} }}
            placeholder="Subheading..."
            style={{ flex:1, background:"transparent", border:"none", borderBottom:"1px dashed #1e293b", color:"var(--text-muted)", fontSize:12, fontFamily:"'DM Serif Display', serif", fontStyle:"italic", padding:"2px 0" }}
          />
          <MiniCheck checked={sh.checks?.textbook||false} onChange={()=>onChange({...sh,checks:{...sh.checks,textbook:!sh.checks?.textbook}})} color="#4ade80" label="TB"/>
          <MiniCheck checked={sh.checks?.claude||false}   onChange={()=>onChange({...sh,checks:{...sh.checks,claude:!sh.checks?.claude}})}   color="#60a5fa" label="CL"/>
          <button onClick={onDelete} style={{ background:"none", border:"none", color:"var(--text-ghost)", fontSize:14, lineHeight:1, padding:"0 2px", flexShrink:0 }}>×</button>
        </div>
      );
    }
    function SubheadingView({ sh, onChange }) {
      return (
        <div style={{ display:"flex", alignItems:"center", gap:5, marginBottom:4 }}>
          <span style={{ color:"var(--text-dim)", fontSize:12, fontFamily:"'DM Mono', monospace" }}>↳</span>
          <span style={{ flex:1, color:"var(--text-dim)", fontSize:12, fontFamily:"'DM Serif Display', serif", fontStyle:"italic" }}>{sh.title}</span>
          <MiniCheck checked={sh.checks?.textbook||false} onChange={()=>onChange({...sh,checks:{...sh.checks,textbook:!sh.checks?.textbook}})} color="#4ade80" label="TB"/>
          <MiniCheck checked={sh.checks?.claude||false}   onChange={()=>onChange({...sh,checks:{...sh.checks,claude:!sh.checks?.claude}})}   color="#60a5fa" label="CL"/>
        </div>
      );
    }

    // ─── SUBSECTION ROWS ─────────────────────────────────────────────────────────
    function SubsectionEdit({ sub, onChange, onDelete, clData }) {
      const [focusIdx, setFocusIdx] = useState(null);
      const displayName = resolveTopicName(sub.clKey, clData);
      const sectionDone = sub.checks.textbook && sub.checks.claude;
      function toggleCheck(k){ onChange({...sub,checks:{...sub.checks,[k]:!sub.checks[k]}}); }
      function addSubheadingAt(ai){ const a=[...sub.subheadings];a.splice(ai+1,0,newSubheading());onChange({...sub,subheadings:a});setFocusIdx(ai+1); }
      function addSubheading(){ onChange({...sub,subheadings:[...sub.subheadings,newSubheading()]});setFocusIdx(sub.subheadings.length); }
      useEffect(()=>{ if(focusIdx!==null) setFocusIdx(null); },[focusIdx]);
      function updateSh(i,u){ const a=[...sub.subheadings];a[i]=u;onChange({...sub,subheadings:a}); }
      function deleteSh(i){ onChange({...sub,subheadings:sub.subheadings.filter((_,j)=>j!==i)}); }
      return (
        <div style={{ background:"var(--bg-deep)", border:`1px solid ${sectionDone?"#1e3a2a":"var(--border)"}`, borderRadius:8, padding:"10px 12px", marginBottom:6, transition:"border-color 0.2s" }}>
          <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:8 }}>
            <span style={{ color:"#3b82f6", fontSize:11, fontFamily:"'DM Mono', monospace", flexShrink:0 }}>§</span>

          <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:sub.subheadings.length?8:0 }}>

            <div style={{ marginTop:6, paddingLeft:4 }}>

          )}
          <button onClick={addSubheading} style={{ marginTop:6, background:"none", border:"none", color:"var(--text-ghost)", fontSize:11, fontFamily:"'DM Mono', monospace", padding:0 }}>+ subheading</button>

          <div style={{ marginTop:10 }}>
            <div style={{ fontFamily:"'DM Mono', monospace", fontSize:9, color:"var(--text-ghost)", letterSpacing:"0.1em", marginBottom:4 }}>LEARNING OBJECTIVES</div>

            />

    }
    function SubsectionView({ sub, onChange, clData }) {
      const displayName = resolveTopicName(sub.clKey, clData);
      const sectionDone = sub.checks.textbook && sub.checks.claude;
      function toggleCheck(k){ onChange({...sub,checks:{...sub.checks,[k]:!sub.checks[k]}}); }
      function updateSh(i,u){ const a=[...sub.subheadings];a[i]=u;onChange({...sub,subheadings:a}); }
      return (
        <div style={{ background:"var(--bg-deep)", border:`1px solid ${sectionDone?"#1e3a2a":"var(--border)"}`, borderRadius:8, padding:"10px 12px", marginBottom:6, transition:"border-color 0.2s" }}>
          <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:7 }}>
            <span style={{ color:"#3b82f6", fontSize:11, fontFamily:"'DM Mono', monospace" }}>§</span>
            <span style={{ color:sectionDone?"var(--text-faint)":"#cbd5e1", fontSize:13, fontFamily:"'DM Serif Display', serif", textDecoration:sectionDone?"line-through":"none", flex:1 }}>{displayName}</span>
            {sectionDone&&<span style={{ fontSize:11, color:"#4ade80" }}>✓</span>}
          </div>
          <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:sub.subheadings.length?6:0 }}>
            <CheckBadge type="textbook" checked={sub.checks.textbook} onChange={()=>toggleCheck("textbook")}/>
            <CheckBadge type="claude"   checked={sub.checks.claude}   onChange={()=>toggleCheck("claude")}/>
          </div>
          {sub.subheadings.length>0&&(
            <div style={{ marginTop:6, paddingLeft:4 }}>
              {sub.subheadings.map((sh,i)=><SubheadingView key={sh.id} sh={sh} onChange={u=>updateSh(i,u)}/>)}
            </div>
          )}
          {(sub.learningObjectives||"").trim()&&(
            <div style={{ marginTop:8, paddingTop:6, borderTop:"1px dashed var(--border-mid)" }}>
              <div style={{ fontFamily:"'DM Mono', monospace", fontSize:9, color:"#3b82f688", letterSpacing:"0.1em", marginBottom:3 }}>LEARNING OBJECTIVES</div>
              <div style={{ fontFamily:"'DM Serif Display', serif", fontSize:11, color:"var(--text-dim)", fontStyle:"italic", lineHeight:1.5 }}>{sub.learningObjectives}</div>
            </div>
          )}
        </div>
      );
    }

    // ─── GENERATE SUMMARY ────────────────────────────────────────────────────────
    function generateSummary(sec, clData) {
      const groups = groupSubsByChapter(sec.subsections);
      let lines = [];
      lines.push(`${sec.subject}: ${sec.topic||"Untitled"}`);
      lines.push("");
      groups.forEach(g => {
        g.subs.forEach(({ sub }) => {
          const name = resolveTopicName(sub.clKey, clData);
          lines.push(`(Section): ${name}`);
          if (sub.subheadings && sub.subheadings.length > 0) {
            sub.subheadings.forEach(sh => {
              if (sh.title.trim()) lines.push(`  - ${sh.title}`);
            });
          }
          if ((sub.learningObjectives||"").trim()) {
            lines.push(`  Learning Objectives: ${sub.learningObjectives.trim()}`);
          }
          lines.push("");
        });
      });
      const text = lines.join("\n").trim();
      navigator.clipboard.writeText(text).then(() => {
        // Flash a toast
        const toast = document.createElement("div");
        toast.textContent = "✓ Summary copied to clipboard!";
        toast.style.cssText = "position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e3a5f;color:#60a5fa;padding:10px 20px;border-radius:8px;font-family:'DM Mono',monospace;font-size:12px;z-index:999;border:1px solid #3b82f6;";
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
      }).catch(() => {
        // Fallback: show in prompt
        prompt("Copy this summary:", text);
      });
    }

    // ─── SECTION CARD ────────────────────────────────────────────────────────────
    function SectionCard({ sec, onChange, onDelete, onMoveRequest, clData, onClDataChange, onChapterComplete, blockIndex }) {
      const [editing, setEditing] = useState(!sec.saved);
      const { color } = sec;
      const fullTitle = sec.topic ? `${sec.subject}: ${sec.topic}` : sec.subject;
      const groups = groupSubsByChapter(sec.subsections);
      const allSubsDone = sec.subsections.length>0 && sec.subsections.every(s=>s.checks.textbook&&s.checks.claude);

      function updateSub(i, u) {
        const newSubs=[...sec.subsections]; newSubs[i]=u;
        onChange({...sec,subsections:newSubs});
        if (u.checks.textbook && u.checks.claude) {
          const existing = clData[u.clKey]||{};
          if (!existing.rev) {
            const newCl = {...clData,[u.clKey]:{...existing,rev:true}};
            onClDataChange(newCl);
            const p = parseClKey(u.clKey);
            if (p && isChapterFullyReved(p.si,p.ci,newCl)) {
              onChapterComplete({ chapterTitle:p.chapter.title, si:p.si, ci:p.ci });
            }
          }
        }
      }
      function deleteSub(i){ onChange({...sec,subsections:sec.subsections.filter((_,j)=>j!==i)}); }
      function handleSave(){ onChange({...sec,saved:true}); setEditing(false); }
      function toggleMin(){ onChange({...sec,minimized:!sec.minimized}); }

      const VideoCheckbox = ({inEdit}) => (
        <button onClick={()=>onChange({...sec,videosWatched:!sec.videosWatched})} style={{ display:"flex", alignItems:"center", gap:5, background:"none", border:`1px solid ${sec.videosWatched?"#a78bfa":"var(--border-accent)"}`, borderRadius:6, padding:inEdit?"3px 8px":"2px 7px", flexShrink:0 }}>
          <span style={{ width:11, height:11, borderRadius:2, border:`1.5px solid ${sec.videosWatched?"#a78bfa":"var(--text-ghost)"}`, background:sec.videosWatched?"#a78bfa22":"transparent", display:"flex", alignItems:"center", justifyContent:"center" }}>
            {sec.videosWatched&&<svg width="7" height="7" viewBox="0 0 7 7" fill="none"><path d="M1 3.5L2.8 5.2L6 1.5" stroke="#a78bfa" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg>}
          </span>
          <span style={{ fontSize:9, fontFamily:"'DM Mono', monospace", color:sec.videosWatched?"#a78bfa":"var(--text-ghost)" }}>Videos</span>
        </button>
      );

      if (!editing) return (
        <div style={{ background:`${color}08`, border:`1px solid ${allSubsDone?"#1e3a2a":color+"44"}`, borderLeft:`4px solid ${color}`, borderTop:`1px solid ${color}33`, borderRadius:10, marginBottom:14, overflow:"hidden", transition:"border-color 0.3s", boxShadow:`0 2px 12px ${color}11` }}>
          <div style={{ display:"flex", alignItems:"center", gap:8, padding:"10px 14px", background:`${color}11` }}>
            <button onClick={toggleMin} style={{ background:"none", border:"none", color:"var(--text-faint)", fontSize:14, lineHeight:1, padding:"0 2px", flexShrink:0 }}>{sec.minimized?"▸":"▾"}</button>
            <span style={{ width:22, height:22, borderRadius:"50%", background:color, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, fontSize:11, fontFamily:"'DM Mono', monospace", fontWeight:700, color:"#0f172a" }}>{blockIndex+1}</span>
            <VideoCheckbox/>
            <span style={{ flex:1, fontFamily:"'DM Serif Display', serif", fontSize:15, fontWeight:700, color:allSubsDone?"#4ade80":"var(--text-primary)" }}>
              {fullTitle||<em style={{color:"var(--text-ghost)",fontWeight:400}}>Untitled</em>}
              {allSubsDone&&<span style={{ fontSize:11, marginLeft:8, color:"#4ade80" }}>✓ Complete</span>}
            </span>
            <div style={{ display:"flex", gap:6, alignItems:"center", flexShrink:0 }}>
              <button onClick={()=>generateSummary(sec, clData)} style={{ background:`${color}22`, border:`1px solid ${color}55`, borderRadius:6, color, fontSize:10, fontFamily:"'DM Mono', monospace", padding:"2px 8px", display:"flex", alignItems:"center", gap:4 }}>
                <span>📋</span><span>Copy Summary</span>
              </button>
              <button onClick={onMoveRequest} style={{ background:"none", border:"1px solid var(--border-accent)", borderRadius:6, color:"var(--text-faint)", fontSize:10, fontFamily:"'DM Mono', monospace", padding:"2px 7px" }}>move →</button>
              <button onClick={()=>setEditing(true)} style={{ background:"none", border:`1px solid ${color}55`, borderRadius:6, color, fontSize:10, fontFamily:"'DM Mono', monospace", padding:"2px 7px" }}>edit</button>
              <button onClick={onDelete} style={{ background:"none", border:"none", color:"var(--text-ghost)", fontSize:18, lineHeight:1 }}>×</button>
            </div>
          </div>
          {!sec.minimized&&(
            <div style={{ padding:"10px 14px 12px" }}>
              {groups.length===0 ? <div style={{ color:"var(--text-ghost)", fontSize:12, fontFamily:"'DM Mono', monospace", fontStyle:"italic" }}>No sections.</div>
                : groups.map(g=>(
                  <div key={`${g.si}-${g.ci}`} style={{ marginBottom:10 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:6, paddingBottom:4, borderBottom:`1px solid ${g.color}22` }}>
                      <span style={{ width:6, height:6, borderRadius:"50%", background:g.color, flexShrink:0 }}/>
                      <span style={{ fontFamily:"'DM Mono', monospace", fontSize:10, color:g.color, letterSpacing:"0.06em", fontWeight:500 }}>{g.chapterTitle}</span>
                    </div>
                    {g.subs.map(({sub,originalIdx})=><SubsectionView key={sub.id} sub={sub} onChange={u=>updateSub(originalIdx,u)} clData={clData}/>)}
                  </div>
                ))
              }
              {(sec.notes||"").length>0&&(
                <div style={{ marginTop:8, padding:"8px 10px", background:"var(--bg-card)", borderRadius:6, border:"1px solid var(--border-mid)" }}>
                  <div style={{ fontFamily:"'DM Mono', monospace", fontSize:9, color:"var(--text-ghost)", marginBottom:4, letterSpacing:"0.1em" }}>NOTES</div>
                  <div style={{ fontFamily:"'DM Serif Display', serif", fontSize:12, color:"var(--text-dim)", lineHeight:1.6, whiteSpace:"pre-wrap" }}>{sec.notes}</div>
                </div>
              )}
            </div>
          )}
        </div>
      );

      return (
        <div style={{ background:`${color}08`, border:`1px solid ${color}66`, borderLeft:`4px solid ${color}`, borderTop:`1px solid ${color}33`, borderRadius:10, padding:"12px 14px", marginBottom:14, boxShadow:`0 2px 12px ${color}11` }}>
          <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:12 }}>
            <VideoCheckbox inEdit/>
            <span style={{ fontFamily:"'DM Mono', monospace", fontSize:11, color, background:`${color}22`, border:`1px solid ${color}44`, borderRadius:6, padding:"2px 8px", flexShrink:0 }}>{sec.subject}</span>
            {sec.topic&&<span style={{ fontFamily:"'DM Serif Display', serif", fontSize:14, fontWeight:700, color:"var(--text-secondary)" }}>{sec.topic}</span>}
            <div style={{ flex:1 }}/>
            <button onClick={onDelete} style={{ background:"none", border:"none", color:"var(--text-faint)", fontSize:18, lineHeight:1, flexShrink:0 }}>×</button>
          </div>
          {groups.length===0 ? <div style={{ color:"var(--text-ghost)", fontSize:12, fontFamily:"'DM Mono', monospace", fontStyle:"italic", marginBottom:8 }}>No sections linked.</div>
            : groups.map(g=>(
              <div key={`${g.si}-${g.ci}`} style={{ marginBottom:10 }}>
                <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:6, paddingBottom:4, borderBottom:`1px solid ${g.color}22` }}>
                  <span style={{ width:6, height:6, borderRadius:"50%", background:g.color, flexShrink:0 }}/>
                  <span style={{ fontFamily:"'DM Mono', monospace", fontSize:10, color:g.color, letterSpacing:"0.06em", fontWeight:500 }}>{g.chapterTitle}</span>
                </div>
                {g.subs.map(({sub,originalIdx})=><SubsectionEdit key={sub.id} sub={sub} onChange={u=>updateSub(originalIdx,u)} onDelete={()=>deleteSub(originalIdx)} clData={clData}/>)}
              </div>
            ))
          }
          <div style={{ marginTop:8, marginBottom:10 }}>
            <div style={{ fontFamily:"'DM Mono', monospace", fontSize:9, color:"var(--text-ghost)", marginBottom:4, letterSpacing:"0.1em" }}>NOTES</div>
            <textarea value={sec.notes||""} onChange={e=>onChange({...sec,notes:e.target.value})} placeholder="Free-write notes for this topic block..." rows={3}
              style={{ width:"100%", background:"var(--bg-card)", border:"1px solid var(--border-mid)", borderRadius:6, color:"var(--text-dim)", fontSize:12, fontFamily:"'DM Serif Display', serif", lineHeight:1.6, padding:"8px 10px" }}
            />
          </div>
          <div style={{ display:"flex", justifyContent:"flex-end" }}>
            <button onClick={handleSave} style={{ background:`${color}22`, border:`1px solid ${color}`, borderRadius:6, color, fontSize:12, fontFamily:"'DM Mono', monospace", padding:"5px 16px", fontWeight:500 }}>save ✓</button>
          </div>
        </div>
      );
    }

    // ─── MOVE MODAL ──────────────────────────────────────────────────────────────
    function MoveModal({ currentDay, onMove, onClose }) {
      return (
        <div style={{ position:"fixed", inset:0, background:"#000b", zIndex:200, display:"flex", alignItems:"center", justifyContent:"center" }} onClick={onClose}>

            {DAYS.filter(d=>d!==currentDay).map(d=>(

    // ─── SECTION BUILDER MODAL ───────────────────────────────────────────────────
    function SectionBuilderModal({ onConfirm, onClose, existingKeys }) {
      const [step, setStep] = useState(1);
      const [pickedSubject, setPickedSubject] = useState(null);
      const [topicName, setTopicName] = useState("");
      const [clSubjIdx, setClSubjIdx] = useState(null);
      const [clChapIdx, setClChapIdx] = useState(null);
      const topicRef = useRef(null);
      useEffect(()=>{ if(step===2&&topicRef.current) topicRef.current.focus(); },[step]);
      function handleConfirm() {
        if(!pickedSubject||clSubjIdx===null||clChapIdx===null) return;
        const ch = CHECKLIST_DATA[clSubjIdx].chapters[clChapIdx];
        const subsections = ch.topics
          .map((_,ti) => `${clSubjIdx}-${clChapIdx}-${ti}`)
          .filter(k => !existingKeys.has(k))
          .map(k => newLinkedSubsection(k));
        if (subsections.length === 0) return;
        onConfirm({ id:crypto.randomUUID(), subject:pickedSubject.label, baseSubject:pickedSubject.baseSubject, color:pickedSubject.color, topic:topicName.trim(), videosWatched:false, notes:"", subsections, saved:false, minimized:false });
      }
      function goToStep3() {
        const matchIdx = CHECKLIST_DATA.findIndex(s => s.subject === pickedSubject.baseSubject);
        if (matchIdx >= 0) { setClSubjIdx(matchIdx); setClChapIdx(null); }
        setStep(3);
      }
      const btn = { borderRadius:8, fontFamily:"'DM Mono', monospace", fontSize:12, padding:"6px 16px", transition:"all 0.15s" };
      return (
        <div style={{ position:"fixed", inset:0, background:"#000c", zIndex:300, display:"flex", alignItems:"center", justifyContent:"center", padding:16 }} onClick={onClose}>
          <div style={{ background:"var(--bg-input)", border:"1px solid var(--border-accent)", borderRadius:16, padding:"24px", width:"100%", maxWidth:520, maxHeight:"88vh", overflowY:"auto" }} onClick={e=>e.stopPropagation()}>
            <div style={{ display:"flex", gap:6, marginBottom:20, alignItems:"center" }}>
              {[1,2,3].map(n=><div key={n} style={{ width:8, height:8, borderRadius:"50%", background:step>=n?"#3b82f6":"var(--border-accent)" }}/>)}
              <span style={{ fontFamily:"'DM Mono', monospace", fontSize:10, color:"var(--text-faint)", marginLeft:4 }}>STEP {step} OF 3</span>
            </div>
            {step===1&&(<>
              <div style={{ fontFamily:"'DM Mono', monospace", fontSize:10, letterSpacing:"0.15em", color:"#3b82f6", marginBottom:12 }}>CHOOSE SUBJECT</div>
              <div style={{ display:"flex", flexDirection:"column", gap:8 }}>

                  <button key={s.label} onClick={()=>setPickedSubject(s)} style={{ ...btn, padding:"12px 16px", textAlign:"left", background:pickedSubject?.label===s.label?`${s.color}22`:"var(--bg-card)", border:`1px solid ${pickedSubject?.label===s.label?s.color:"var(--border)"}`, color:pickedSubject?.label===s.label?s.color:"var(--text-dim)", display:"flex", alignItems:"center", gap:10, fontSize:14, fontFamily:"'DM Serif Display', serif" }}>
                    <span style={{ width:10, height:10, borderRadius:"50%", background:s.color, flexShrink:0 }}/><span>{s.label}</span>
                  </button>
                ))}
              </div>
              <div style={{ display:"flex", justifyContent:"flex-end", marginTop:20, gap:8 }}>
                <button onClick={onClose} style={{ ...btn, background:"none", border:"1px solid var(--border)", color:"var(--text-faint)" }}>Cancel</button>
                <button onClick={()=>setStep(2)} disabled={!pickedSubject} style={{ ...btn, background:pickedSubject?`${pickedSubject.color}22`:"var(--bg-input)", border:`1px solid ${pickedSubject?.color||"var(--border)"}`, color:pickedSubject?.color||"var(--text-faint)", opacity:pickedSubject?1:0.4 }}>Next →</button>
              </div>
            </>)}
            {step===2&&(<>
              <div style={{ fontFamily:"'DM Mono', monospace", fontSize:10, letterSpacing:"0.15em", color:"#3b82f6", marginBottom:12 }}>TOPIC NAME</div>
              <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8 }}>
                <span style={{ fontFamily:"'DM Serif Display', serif", fontWeight:700, color:pickedSubject.color, fontSize:15 }}>{pickedSubject.label}</span><span style={{ color:"var(--text-faint)" }}>:</span>
              </div>
              <input ref={topicRef} value={topicName} onChange={e=>setTopicName(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter"&&topicName.trim()) setStep(3); }} placeholder="e.g. Quantum Numbers, Cell Signaling..."
                style={{ width:"100%", background:"var(--bg-card)", border:`1px solid ${pickedSubject.color}55`, borderRadius:8, color:"var(--text-secondary)", fontSize:15, fontFamily:"'DM Serif Display', serif", fontWeight:700, padding:"10px 14px" }}
              />
              <div style={{ display:"flex", justifyContent:"space-between", marginTop:20, gap:8 }}>
                <button onClick={()=>setStep(1)} style={{ ...btn, background:"none", border:"1px solid var(--border)", color:"var(--text-faint)" }}>← Back</button>
                <button onClick={()=>goToStep3()} disabled={!topicName.trim()} style={{ ...btn, background:topicName.trim()?`${pickedSubject.color}22`:"var(--bg-input)", border:`1px solid ${topicName.trim()?pickedSubject.color:"var(--border)"}`, color:topicName.trim()?pickedSubject.color:"var(--text-faint)", opacity:topicName.trim()?1:0.4 }}>Next →</button>
              </div>

              <div style={{ fontFamily:"'DM Mono', monospace", fontSize:10, letterSpacing:"0.15em", color:"#3b82f6", marginBottom:12 }}>ADD SECTIONS FROM CHECKLIST</div>

                    ))}
                  </div>
                </div>
              )}
              {clSubjIdx!==null&&clChapIdx!==null&&(
                <div style={{ marginBottom:16 }}>
                  <div style={{ fontFamily:"'DM Mono', monospace", fontSize:9, letterSpacing:"0.1em", color:"var(--text-ghost)", marginBottom:8 }}>SECTIONS IN THIS CHAPTER</div>
                  <div style={{ display:"flex", flexDirection:"column", gap:3 }}>
                    {CHECKLIST_DATA[clSubjIdx].chapters[clChapIdx].topics.map((t,ti)=>{
                      const k=`${clSubjIdx}-${clChapIdx}-${ti}`; const already=existingKeys.has(k); const c=CHECKLIST_DATA[clSubjIdx].color;
                      return (
                        <div key={ti} style={{ padding:"6px 12px", background:already?"var(--bg-inner)":"var(--bg-card)", border:`1px solid ${already?"var(--border)":"var(--border)"}`, borderRadius:8, display:"flex", alignItems:"center", gap:8 }}>
                          <span style={{ width:6, height:6, borderRadius:"50%", background:already?"var(--text-ghost)":c, flexShrink:0 }}/>
                          <span style={{ fontSize:12, fontFamily:"'DM Serif Display', serif", color:already?"var(--text-phantom)":"var(--text-dim)", textDecoration:already?"line-through":"none", opacity:already?0.5:1, flex:1 }}>{t}</span>
                          {already&&<span style={{ fontFamily:"'DM Mono', monospace", fontSize:9, color:"var(--text-phantom)" }}>in use</span>}
                        </div>
                      );
                    })}
                  </div>
                  <div style={{ marginTop:10, fontFamily:"'DM Mono', monospace", fontSize:10, color:"#3b82f6" }}>
                    All {CHECKLIST_DATA[clSubjIdx].chapters[clChapIdx].topics.filter((_,ti)=>!existingKeys.has(`${clSubjIdx}-${clChapIdx}-${ti}`)).length} available sections will be added
                  </div>
                </div>
              )} style={{ ...btn, padding:"6px 12px", textAlign:"left", background:sel?`${c}22`:already?"var(--bg-inner)":"var(--bg-card)", border:`1px solid ${sel?c:already?"#1e293b55":"var(--border)"}`, color:sel?c:already?"var(--text-ghost)":"var(--text-dim)", fontSize:12, fontFamily:"'DM Serif Display', serif", display:"flex", alignItems:"center", gap:8, cursor:already?"default":"pointer" }}>
  
                      );
                    })}
                  </div>
                </div>
              )}
              
              <div style={{ display:"flex", justifyContent:"space-between", gap:8 }}>
                <button onClick={()=>setStep(2)} style={{ ...btn, background:"none", border:"1px solid var(--border)", color:"var(--text-faint)" }}>← Back</button>
                <button onClick={handleConfirm} disabled={clChapIdx===null} style={{ ...btn, background:clChapIdx!==null?"#3b82f622":"var(--bg-input)", border:`1px solid ${clChapIdx!==null?"#3b82f6":"var(--border)"}`, color:clChapIdx!==null?"#60a5fa":"var(--text-faint)", opacity:clChapIdx!==null?1:0.4 }}>Add Topic Block ✓</button>
              </div>
            </>)}
          </div>
        </div>
      );
    }

    // ─── DAY PANEL ───────────────────────────────────────────────────────────────
    function DayPanel({ day, data, onChange, onMoveSection, clData, onClDataChange, onChapterComplete, allUsedClKeys }) {
      const [open, setOpen] = useState(false);
      const [moveIdx, setMoveIdx] = useState(null);
      const [showBuilder, setShowBuilder] = useState(false);
      const color = DAY_COLORS[day];
      const count = data.sections.length;
      const doneTopic = data.sections.filter(s=>s.subsections.length>0&&s.subsections.every(sub=>sub.checks.textbook&&sub.checks.claude)).length;

      function addSectionFromBuilder(sec){ onChange({...data,sections:[...data.sections,sec]}); setShowBuilder(false); if(!open) setOpen(true); }
      function updateSection(i,u){ const a=[...data.sections];a[i]=u;onChange({...data,sections:a}); }
      function deleteSection(i){
        const sec = data.sections[i];
        const clearedSubs = sec.subsections.filter(sub=>sub.checks.textbook&&sub.checks.claude);
        if (clearedSubs.length>0) {
          let newCl={...clData};
          clearedSubs.forEach(sub=>{ if(newCl[sub.clKey]) newCl[sub.clKey]={...newCl[sub.clKey],rev:false}; });
          onClDataChange(newCl);
        }
        onChange({...data,sections:data.sections.filter((_,j)=>j!==i)});
      }
      function handleMoveConfirm(targetDay){ const sec=data.sections[moveIdx]; onMoveSection(day,targetDay,sec); setMoveIdx(null); }

      return (
        <div style={{ marginBottom:8, borderRadius:12, border:`1px solid ${open?color+"44":"var(--border)"}`, overflow:"hidden", transition:"border-color 0.2s" }}>
          {moveIdx!==null&&<MoveModal currentDay={day} onMove={handleMoveConfirm} onClose={()=>setMoveIdx(null)}/>}
          {showBuilder&&<SectionBuilderModal onConfirm={addSectionFromBuilder} onClose={()=>setShowBuilder(false)} existingKeys={allUsedClKeys}/>}
          <button onClick={()=>setOpen(!open)} style={{ width:"100%", display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 16px", background:open?`${color}11`:"var(--bg-input)", border:"none", transition:"background 0.2s" }}>
            <div style={{ display:"flex", alignItems:"center", gap:10 }}>
              <span style={{ width:8, height:8, borderRadius:"50%", background:color, flexShrink:0 }}/>
              <span style={{ fontFamily:"'DM Mono', monospace", fontSize:13, color:open?color:"var(--text-muted)", letterSpacing:"0.06em", fontWeight:500 }}>{day.toUpperCase()}</span>
              {count>0&&<span style={{ fontSize:10, fontFamily:"'DM Mono', monospace", color:"var(--text-faint)", background:"var(--border)", borderRadius:10, padding:"1px 7px" }}>{count} topic{count!==1?"s":""}</span>}
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              {count>0&&<span style={{ fontSize:11, fontFamily:"'DM Mono', monospace", color:doneTopic===count&&count>0?"#4ade80":"var(--text-faint)" }}>{doneTopic}/{count} done</span>}
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style={{ transform:open?"rotate(180deg)":"rotate(0deg)", transition:"transform 0.2s" }}>
                <path d="M2 4L6 8L10 4" stroke="var(--text-faint)" strokeWidth="1.5" strokeLinecap="round"/>
              </svg>
            </div>
          </button>
          {open&&(
            <div style={{ padding:"12px 14px", background:"var(--bg-deeper)" }}>
              {data.sections.map((sec,i)=>(
                <SectionCard key={sec.id} sec={sec} onChange={u=>updateSection(i,u)} onDelete={()=>deleteSection(i)} onMoveRequest={()=>setMoveIdx(i)} clData={clData} onClDataChange={onClDataChange} onChapterComplete={onChapterComplete} blockIndex={i}/>
              ))}
              <button onClick={()=>setShowBuilder(true)} style={{ background:"none", border:`1px dashed ${color}55`, borderRadius:8, color, fontSize:12, fontFamily:"'DM Mono', monospace", padding:"7px 12px", width:"100%" }}>+ add topic block</button>
            </div>
          )}
        </div>
      );
    }

    // ─── CHECKLIST TAB ───────────────────────────────────────────────────────────
    function ChecklistTab({ clData, onChange }) {
      const [activeSubject, setActiveSubject] = useState(0);
      const [expandedChapters, setExpandedChapters] = useState({});
      const [editingName, setEditingName] = useState(null);
      const [editingNameVal, setEditingNameVal] = useState("");
      const nameInputRef = useRef(null);

      function getTopicKey(si,ci,ti){ return `${si}-${ci}-${ti}`; }
      function getTopicState(si,ci,ti){ return clData[getTopicKey(si,ci,ti)]||{rev:false,note:"",customName:null}; }
      function setTopicState(si,ci,ti,val){ onChange({...clData,[getTopicKey(si,ci,ti)]:val}); }
      function toggleChapterAnki(si,ci){ const k=getChapterAnkiKey(si,ci); onChange({...clData,[k]:!clData[k]}); }
      function toggleChapter(key){ setExpandedChapters(p=>({...p,[key]:!p[key]})); }
      function startEditName(si,ci,ti,cur){ setEditingName(`${si}-${ci}-${ti}`); setEditingNameVal(cur); }
      function commitEditName(si,ci,ti){ const s=getTopicState(si,ci,ti); setTopicState(si,ci,ti,{...s,customName:editingNameVal.trim()||null}); setEditingName(null); }
      useEffect(()=>{ if(editingName&&nameInputRef.current) nameInputRef.current.focus(); },[editingName]);

      function subjectProgress(si){
        const subj=CHECKLIST_DATA[si]; let total=0,done=0;
        subj.chapters.forEach((ch,ci)=>{ const chAnki=getChapterAnki(si,ci,clData); ch.topics.forEach((_,ti)=>{ total++; const s=getTopicState(si,ci,ti); if(s.rev&&chAnki) done++; }); });
        return { total, done, pct:total===0?0:Math.round((done/total)*100) };
      }
      const subj=CHECKLIST_DATA[activeSubject]; const color=subj.color;
      const allProgress=CHECKLIST_DATA.map((_,si)=>subjectProgress(si));

      return (
        <div>
          <div style={{ display:"flex", gap:10, marginBottom:20, flexWrap:"wrap" }}>
            {CHECKLIST_DATA.map((s,si)=>{
              const {done,total,pct}=allProgress[si]; const isActive=si===activeSubject;
              const r=22,circ=2*Math.PI*r;
              return (
                <button key={si} onClick={()=>setActiveSubject(si)} style={{ flex:"1 1 100px", background:isActive?`${s.color}11`:"var(--bg-card)", border:`1px solid ${isActive?s.color+"66":"var(--border)"}`, borderRadius:12, padding:"12px 10px", display:"flex", flexDirection:"column", alignItems:"center", gap:8, transition:"all 0.15s" }}>
                  <div style={{ position:"relative", width:52, height:52 }}>
                    <svg width="52" height="52" style={{ transform:"rotate(-90deg)" }}>
                      <circle cx="26" cy="26" r={r} stroke="var(--border)" strokeWidth="4" fill="transparent"/>
                      <circle cx="26" cy="26" r={r} stroke={s.color} strokeWidth="4" fill="transparent" strokeDasharray={circ} strokeDashoffset={circ-(pct/100)*circ} strokeLinecap="round" style={{ transition:"stroke-dashoffset 0.5s ease" }}/>
                    </svg>
                    <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", fontFamily:"'DM Mono', monospace", fontSize:10, color:isActive?s.color:"var(--text-dim)", fontWeight:500 }}>{pct}%</div>
                  </div>
                  <span style={{ fontFamily:"'DM Mono', monospace", fontSize:9, letterSpacing:"0.1em", color:isActive?s.color:"var(--text-faint)", textTransform:"uppercase", textAlign:"center", lineHeight:1.3 }}>{s.subject}</span>
                  <span style={{ fontFamily:"'DM Mono', monospace", fontSize:9, color:"var(--text-ghost)" }}>{done}/{total}</span>
                </button>
              );
            })}
          </div>
          <div style={{ background:"var(--bg-card)", border:`1px solid ${color}33`, borderTop:`2px solid ${color}`, borderRadius:12, overflow:"hidden" }}>
            <div style={{ padding:"16px 20px", background:`${color}0d`, borderBottom:`1px solid ${color}22`, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
              <div>
                <div style={{ fontFamily:"'DM Mono', monospace", fontSize:10, letterSpacing:"0.15em", color, textTransform:"uppercase", marginBottom:2 }}>Master Checklist</div>
                <div style={{ fontFamily:"'DM Serif Display', serif", fontSize:20, fontWeight:700, color:"var(--text-primary)" }}>{subj.subject}</div>
              </div>
              <div style={{ textAlign:"right" }}>
                <div style={{ fontFamily:"'DM Mono', monospace", fontSize:10, color:"var(--text-faint)", marginBottom:4 }}>TOTAL PROGRESS</div>
                <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                  <div style={{ width:120, height:4, background:"var(--bg-input)", borderRadius:2, overflow:"hidden" }}>
                    <div style={{ height:"100%", width:`${allProgress[activeSubject].pct}%`, background:color, borderRadius:2, transition:"width 0.4s" }}/>
                  </div>
                  <span style={{ fontFamily:"'DM Mono', monospace", fontSize:11, color }}>{allProgress[activeSubject].pct}%</span>
                </div>
              </div>
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 200px 52px", padding:"6px 20px", background:"var(--bg-deep)", borderBottom:"1px solid var(--border-mid)" }}>
              <span style={{ fontFamily:"'DM Mono', monospace", fontSize:9, letterSpacing:"0.12em", color:"var(--text-ghost)" }}>SUB-TOPIC</span>
              <span style={{ fontFamily:"'DM Mono', monospace", fontSize:9, letterSpacing:"0.12em", color:"var(--text-ghost)" }}>QUICK NOTE</span>
              <span style={{ fontFamily:"'DM Mono', monospace", fontSize:9, letterSpacing:"0.12em", color:"#4ade8077", textAlign:"center" }}>REV</span>
            </div>
            {subj.chapters.map((ch,ci)=>{
              const chKey=`${activeSubject}-${ci}`; const isOpen=expandedChapters[chKey]!==false;
              const chAnki=getChapterAnki(activeSubject,ci,clData);
              const revDone=ch.topics.filter((_,ti)=>getTopicState(activeSubject,ci,ti).rev).length;
              const allReved=revDone===ch.topics.length&&ch.topics.length>0;
              return (
                <div key={ci} style={{ borderBottom:"1px solid var(--border-mid)" }}>
                  <div style={{ display:"flex", alignItems:"center", background:"var(--bg-deep)", padding:"0 20px" }}>
                    <button onClick={()=>toggleChapter(chKey)} style={{ flex:1, display:"flex", alignItems:"center", gap:8, padding:"9px 0", background:"none", border:"none", textAlign:"left" }}>
                      <span style={{ fontFamily:"'DM Mono', monospace", fontSize:10, color, letterSpacing:"0.06em" }}>{isOpen?"▾":"▸"}</span>
                      <span style={{ fontFamily:"'DM Serif Display', serif", fontSize:13, fontWeight:700, color:"var(--text-muted)" }}>{ch.title}</span>
                      <span style={{ fontFamily:"'DM Mono', monospace", fontSize:10, color:allReved?"#4ade80":"var(--text-ghost)", marginLeft:4 }}>{revDone}/{ch.topics.length} rev</span>
                      {allReved&&!chAnki&&<span style={{ fontFamily:"'DM Mono', monospace", fontSize:9, color:"#f97316", background:"#f9731611", border:"1px solid #f9731633", borderRadius:10, padding:"1px 6px", marginLeft:4 }}>→ Add Anki!</span>}
                    </button>
                    <button onClick={()=>toggleChapterAnki(activeSubject,ci)} style={{ display:"flex", alignItems:"center", gap:5, padding:"4px 10px", borderRadius:20, border:`1.5px solid ${chAnki?"#f97316":"var(--border-accent)"}`, background:chAnki?"#f9731622":"transparent", transition:"all 0.15s", flexShrink:0 }}>
                      <span style={{ width:13, height:13, borderRadius:"50%", flexShrink:0, border:`1.5px solid ${chAnki?"#f97316":"var(--text-ghost)"}`, background:chAnki?"#f97316":"transparent", display:"flex", alignItems:"center", justifyContent:"center" }}>
                        {chAnki&&<svg width="8" height="8" viewBox="0 0 8 8" fill="none"><path d="M1.5 4L3.2 5.7L6.5 2.3" stroke="#0f172a" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                      </span>
                      <span style={{ fontFamily:"'DM Mono', monospace", fontSize:10, color:chAnki?"#f97316":"var(--text-ghost)" }}>Anki</span>
                    </button>
                  </div>
                  {isOpen&&ch.topics.map((topic,ti)=>{
                    const state=getTopicState(activeSubject,ci,ti);
                    const displayName=state.customName??topic;
                    const isEditingThis=editingName===`${activeSubject}-${ci}-${ti}`;
                    const rowDone=state.rev&&chAnki;
                    function upd(patch){ setTopicState(activeSubject,ci,ti,{...state,...patch}); }
                    return (
                      <div key={ti} style={{ display:"grid", gridTemplateColumns:"1fr 200px 52px", alignItems:"center", padding:"7px 20px 7px 32px", background:rowDone?"#0a1a12":state.rev?"#0a1520":"var(--bg-deeper)", borderTop:"1px solid #0d1a2d", transition:"background 0.2s" }}>
                        <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                          {isEditingThis?(
                            <input ref={nameInputRef} value={editingNameVal} onChange={e=>setEditingNameVal(e.target.value)} onBlur={()=>commitEditName(activeSubject,ci,ti)} onKeyDown={e=>{ if(e.key==="Enter"||e.key==="Escape") commitEditName(activeSubject,ci,ti); }}
                              style={{ flex:1, background:"var(--bg-input)", border:"1px solid #3b82f6", borderRadius:4, color:"var(--text-secondary)", fontSize:12, fontFamily:"'DM Serif Display', serif", padding:"2px 6px" }}
                            />
                          ):(
                            <>
                              <span style={{ fontFamily:"'DM Serif Display', serif", fontSize:12, color:rowDone?"var(--text-ghost)":state.rev?"#4ade8099":"var(--text-dim)", textDecoration:rowDone?"line-through":"none", lineHeight:1.4, flex:1 }}>{displayName}</span>
                              <button onClick={()=>startEditName(activeSubject,ci,ti,displayName)} style={{ background:"none", border:"none", color:"var(--border-accent)", fontSize:10, lineHeight:1, flexShrink:0, opacity:0.6 }}>✎</button>
                            </>
                          )}
                        </div>
                        <input value={state.note||""} onChange={e=>upd({note:e.target.value})} placeholder="Quick note..."
                          style={{ background:"transparent", border:"none", borderBottom:"1px dashed var(--border)", color:"var(--text-faint)", fontSize:11, fontFamily:"'DM Serif Display', serif", fontStyle:"italic", padding:"2px 4px", width:"100%" }}
                        />
                        <div style={{ display:"flex", justifyContent:"center" }}>
                          <button onClick={()=>upd({rev:!state.rev})} style={{ width:20, height:20, borderRadius:4, border:`1.5px solid ${state.rev?"#4ade80":"var(--border-accent)"}`, background:state.rev?"#4ade8022":"transparent", display:"flex", alignItems:"center", justifyContent:"center" }}>
                            {state.rev&&<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1.5 5L4 7.5L8.5 2.5" stroke="#4ade80" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─── MAIN APP ────────────────────────────────────────────────────────────────
    function MCATDashboard() {
      const [weekIndex, setWeekIndex] = useState(()=>getWeekIndex(new Date()));
      const [allData, setAllData] = useState({});
      const [clData, setClData] = useState({});
      const [loading, setLoading] = useState(true);
      const [syncStatus, setSyncStatus] = useState("idle"); // idle | saving | saved | error
      const [activeTab, setActiveTab] = useState("planner");
      const [ankiNotification, setAnkiNotification] = useState(null);
      const [darkMode, setDarkMode] = useState(()=>localStorage.getItem('mcat_theme')!=='light');
      const notifiedChapters = useRef(new Set());
      const saveTimer = useRef(null);

      useEffect(()=>{
        document.body.className = darkMode ? 'dark' : 'light';
        localStorage.setItem('mcat_theme', darkMode ? 'dark' : 'light');
      },[darkMode]);

      // Load from Supabase on mount
      useEffect(()=>{
        async function load() {
          const [pd, cd] = await Promise.all([dbLoad("planner"), dbLoad("checklist")]);
          setAllData(pd || {});
          setClData(cd || {});
          setLoading(false);
        }
        load();
      },[]);

      // Debounced auto-save — waits 1.5s after last change before writing to Supabase
      function triggerSave(plannerData, checklistData) {
        clearTimeout(saveTimer.current);
        setSyncStatus("saving");
        saveTimer.current = setTimeout(async ()=>{
          try {
            await Promise.all([
              dbSave("planner",   plannerData),
              dbSave("checklist", checklistData),
            ]);
            setSyncStatus("saved");
            setTimeout(()=>setSyncStatus("idle"), 2000);
          } catch(e) {
            setSyncStatus("error");
            console.error("Save failed:", e);
          }
        }, 1500);
      }

      function setAllDataAndSave(fn) {
        setAllData(prev => {
          const next = typeof fn==="function" ? fn(prev) : fn;
          triggerSave(next, clData);
          return next;
        });
      }
      function setClDataAndSave(next) {
        setClData(next);
        triggerSave(allData, next);
      }

      const weekKey=`week_${weekIndex}`;
      const weekData=allData[weekKey]??defaultWeek();
      function updateWeek(u){ setAllDataAndSave(p=>({...p,[weekKey]:u})); }
      function updateDay(day,v){ updateWeek({...weekData,days:{...weekData.days,[day]:v}}); }
      function handleMoveSection(sourceDay,targetDay,sec){
        const sd=weekData.days[sourceDay]??{sections:[]};
        const td=weekData.days[targetDay]??{sections:[]};
        updateWeek({...weekData,days:{...weekData.days,[sourceDay]:{...sd,sections:sd.sections.filter(s=>s.id!==sec.id)},[targetDay]:{...td,sections:[sec,...td.sections]}}});
      }
      function handleChapterComplete(info){
        const key=`${info.si}-${info.ci}`;
        if(notifiedChapters.current.has(key)) return;
        if(getChapterAnki(info.si,info.ci,clData)) return;
        notifiedChapters.current.add(key);
        setAnkiNotification(info);
      }

      const allSubs=Object.values(weekData.days).flatMap(d=>d.sections.flatMap(s=>s.subsections));
      const total=allSubs.length;
      const doneTextbook=allSubs.filter(s=>s.checks.textbook).length;
      const doneClaude=allSubs.filter(s=>s.checks.claude).length;
      const allUsedClKeys=new Set(allSubs.map(s=>s.clKey).filter(Boolean));

      const TABS=[{id:"planner",label:"Planner"},{id:"overview",label:"Week Overview"},{id:"checklist",label:"Checklist"}];

      const syncColor = syncStatus==="saved"?"#4ade80":syncStatus==="saving"?"#f97316":syncStatus==="error"?"#f43f5e":"transparent";
      const syncText  = syncStatus==="saved"?"✓ saved":syncStatus==="saving"?"saving…":syncStatus==="error"?"⚠ error":"";

      if (loading) return (
        <div style={{ minHeight:"100vh", background:"var(--bg-page)", display:"flex", alignItems:"center", justifyContent:"center", flexDirection:"column", gap:16 }}>
          <div style={{ width:40, height:40, borderRadius:"50%", border:"3px solid var(--border-accent)", borderTopColor:"#3b82f6", animation:"spin 0.8s linear infinite" }}/>
          <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
          <div style={{ fontFamily:"'DM Mono', monospace", fontSize:12, color:"var(--text-faint)" }}>Loading your dashboard…</div>
        </div>
      );

      return (
        <div style={{ minHeight:"100vh", background:"var(--bg-page)", color:"var(--text-secondary)", fontFamily:"'DM Serif Display', serif", paddingBottom:80 }}>
          <AnkiToast notification={ankiNotification} onClose={()=>setAnkiNotification(null)}/>

          {/* Header */}
          <div style={{ background:"linear-gradient(180deg,var(--bg-header),var(--bg-page))", borderBottom:"1px solid var(--border-mid)", padding:"24px 32px 0", position:"sticky", top:0, zIndex:10 }}>
            <div style={{ maxWidth:1100, margin:"0 auto" }}>
              <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", flexWrap:"wrap", gap:12, paddingBottom:16 }}>
                <div>
                  <div style={{ fontFamily:"'DM Mono', monospace", fontSize:10, letterSpacing:"0.2em", color:"#3b82f6", marginBottom:4 }}>MCAT STUDY TRACKER</div>
                  <h1 style={{ fontSize:24, fontWeight:400, margin:0, color:"var(--text-primary)", fontStyle:"italic" }}>Weekly Dashboard</h1>
                </div>
                <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                  <button onClick={()=>setWeekIndex(i=>Math.max(0,i-1))} disabled={weekIndex===0} style={{ background:"var(--bg-input)", border:"1px solid var(--border-accent)", borderRadius:8, color:weekIndex===0?"var(--text-phantom)":"#60a5fa", width:32, height:32, fontSize:16, display:"flex", alignItems:"center", justifyContent:"center" }}>‹</button>
                  <div style={{ textAlign:"center", minWidth:145 }}>
                    <div style={{ fontFamily:"'DM Mono', monospace", fontSize:11, color:"#3b82f6", letterSpacing:"0.08em" }}>WEEK {weekIndex+1}</div>
                    <div style={{ fontFamily:"'DM Mono', monospace", fontSize:11, color:"var(--text-faint)" }}>{weekLabel(weekIndex)}</div>
                  </div>
                  <button onClick={()=>setWeekIndex(i=>i+1)} style={{ background:"var(--bg-input)", border:"1px solid var(--border-accent)", borderRadius:8, color:"#60a5fa", width:32, height:32, fontSize:16, display:"flex", alignItems:"center", justifyContent:"center" }}>›</button>
                  {syncText&&<span style={{ fontFamily:"'DM Mono', monospace", fontSize:10, color:syncColor, marginLeft:4, transition:"color 0.3s" }}>{syncText}</span>}
                  {/* Dark/Light toggle */}
                  <button onClick={()=>setDarkMode(d=>!d)} title={darkMode?"Switch to light mode":"Switch to dark mode"} style={{
                    marginLeft:8, background:darkMode?"var(--bg-input)":"#e0e7ff",
                    border:`1px solid ${darkMode?"var(--border-accent)":"#a5b4fc"}`,
                    borderRadius:20, padding:"4px 10px", display:"flex", alignItems:"center", gap:6,
                    color:darkMode?"#60a5fa":"#4f46e5", fontSize:13,
                  }}>
                    {darkMode ? "☀️" : "🌙"}
                    <span style={{ fontFamily:"'DM Mono', monospace", fontSize:10 }}>{darkMode?"Light":"Dark"}</span>
                  </button>
                </div>
              </div>

              {activeTab!=="checklist"&&total>0&&(
                <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap", paddingBottom:14 }}>
                  {[["Textbook",doneTextbook,"#4ade80"],["Claude",doneClaude,"#60a5fa"]].map(([label,val,color])=>(
                    <div key={label} style={{ display:"flex", alignItems:"center", gap:6, flex:1, minWidth:130 }}>
                      <span style={{ fontFamily:"'DM Mono', monospace", fontSize:10, color:"var(--text-faint)", width:52 }}>{label}</span>
                      <div style={{ flex:1, height:3, background:"var(--bg-deep)", borderRadius:2, overflow:"hidden" }}>
                        <div style={{ height:"100%", width:`${(val/total)*100}%`, background:color, borderRadius:2, transition:"width 0.3s" }}/>
                      </div>
                      <span style={{ fontFamily:"'DM Mono', monospace", fontSize:10, color:"var(--text-faint)" }}>{val}/{total}</span>
                    </div>
                  ))}
                </div>
              )}

              <div style={{ display:"flex", gap:0, borderTop:"1px solid var(--border-mid)" }}>
                {TABS.map(tab=>(
                  <button key={tab.id} onClick={()=>setActiveTab(tab.id)} style={{ background:"none", border:"none", fontFamily:"'DM Mono', monospace", fontSize:12, letterSpacing:"0.06em", color:activeTab===tab.id?"#60a5fa":"var(--text-faint)", padding:"10px 20px 9px", borderBottom:`2px solid ${activeTab===tab.id?"#60a5fa":"transparent"}`, transition:"all 0.15s", marginBottom:-1 }}>{tab.label.toUpperCase()}</button>
                ))}
              </div>
            </div>
          </div>

          {/* Body */}
          <div style={{ maxWidth:1100, margin:"0 auto", padding:"24px 24px 0" }}>
            {activeTab==="planner"&&(
              <>
                <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:14 }}>
                  <span style={{ fontFamily:"'DM Mono', monospace", fontSize:10, letterSpacing:"0.2em", color:"#3b82f6", textTransform:"uppercase", flexShrink:0 }}>Daily Schedule</span>
                  <div style={{ flex:1, height:1, background:"linear-gradient(90deg, var(--border-accent), transparent)" }}/>
                </div>
                {DAYS.map(day=>(
                  <DayPanel key={day} day={day}
                    data={weekData.days[day]??{sections:[]}}
                    onChange={v=>updateDay(day,v)}
                    onMoveSection={handleMoveSection}
                    clData={clData} onClDataChange={setClDataAndSave}
                    onChapterComplete={handleChapterComplete}
                    allUsedClKeys={allUsedClKeys}
                  />
                ))}
              </>
            )}
            {activeTab==="overview"&&(
              <>
                <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:16 }}>
                  <span style={{ fontFamily:"'DM Mono', monospace", fontSize:10, letterSpacing:"0.2em", color:"#3b82f6", textTransform:"uppercase", flexShrink:0 }}>Week at a Glance</span>
                  <div style={{ flex:1, height:1, background:"linear-gradient(90deg, var(--border-accent), transparent)" }}/>
                  <span style={{ fontFamily:"'DM Mono', monospace", fontSize:10, color:"var(--text-ghost)" }}>read-only · edit in Planner</span>
                </div>
                <WeekOverview weekData={weekData} clData={clData}/>
              </>
            )}
            {activeTab==="checklist"&&(
              <>
                <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:16 }}>
                  <span style={{ fontFamily:"'DM Mono', monospace", fontSize:10, letterSpacing:"0.2em", color:"#3b82f6", textTransform:"uppercase", flexShrink:0 }}>Master Checklist</span>
                  <div style={{ flex:1, height:1, background:"linear-gradient(90deg, var(--border-accent), transparent)" }}/>
                  <span style={{ fontFamily:"'DM Mono', monospace", fontSize:10, color:"var(--text-ghost)" }}>Rev = per subtopic · Anki = per chapter · ✎ = edit name</span>
                </div>
                <ChecklistTab clData={clData} onChange={setClDataAndSave}/>
              </>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<MCATDashboard/>);
  </script>
</body>
</html>
